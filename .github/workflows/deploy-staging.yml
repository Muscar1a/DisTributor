name: Deploy Staging to Render

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai20k-build-phase-cohort-3/p-156

jobs:
  build-and-push:
    runs-on: [self-hosted, cohort3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-dev
            type=sha,prefix=dev-,format=short
      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, cohort3]
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Validate staging deploy webhook
        if: ${{ env.DEPLOY_HOOK_URL == '' }}
        run: exit 1
      - name: Trigger Render staging deploy
        run: curl --fail-with-body --silent --show-error --request POST $DEPLOY_HOOK_URL
