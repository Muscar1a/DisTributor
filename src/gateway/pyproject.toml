[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute-gateway"
version = "0.1.0"
description = "AI Agent Gateway for routing multi-provider requests based on difficulty"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SmartRoute Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "pyyaml>=6.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.0.270",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
asyncio_mode = "auto"
